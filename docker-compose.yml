version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./samples:/app/samples

  ui:
    build: .
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./samples:/app/samples
      - ./uploaded_clients:/app/uploaded_clients
    depends_on:
      - api
